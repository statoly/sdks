[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statoly"
version = "0.1.0"
description = "Official Python client for the Statoly API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Statoly", email = "info@statoly.com" }]
dependencies = ["microsoft-kiota-bundle>=1.9.0"]

[project.urls]
Homepage = "https://statoly.com"
Source = "https://github.com/statoly/sdks"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/statoly"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
